# stewg.dev is the canonical host; www redirects to it.
#
# Both hostnames are on the Coolify application's domain list, so Traefik routes
# both here and nginx decides between them. Deliberately not a Cloudflare Redirect
# Rule: keeping it here means the canonical-host choice is visible from a checkout
# and versioned with the site, rather than living only in a dashboard.
server {
    listen 80;
    server_name www.stewg.dev;

    # $request_uri carries the path *and* query string, so deep links survive.
    return 301 https://stewg.dev$request_uri;
}

server {
    # default_server so the apex — and anything else Traefik sends — lands here.
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # The stock image would answer with its own error body, not the site's page.
    error_page 404 /404.html;
}
